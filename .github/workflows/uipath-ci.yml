name: UiPath GitHub Actions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@eef6142db1ff2b24b75d6f873714104d3beac45c

      - name: Check UiPath project files
        shell: pwsh
        run: |
          $requiredFiles = @(
            "Main.xaml",
            "project.json",
            "project.uiproj"
          )

          foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) {
              throw "Required file missing: $file"
            }

            Write-Host "Found: $file"
          }

          Write-Host "UiPath project file check passed."
